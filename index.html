<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="index.css">
  <script defer src="index.js"></script>
  <script src="https://kit.fontawesome.com/279f2c02eb.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">
    <header class="navbar">
      <div class="header__wrapper">
        <div class="logo__wrapper">
          <img src="assets/logo.png" class="logo" alt="">
        </div>
        <ul class="nav__links">
          <li>
            <a href="#home" class="nav__link link__hover-effect">Home</a>
          </li>
          <li>
            <a href="#movies__section" class="nav__btn">Find a Movie</a>
          </li>
        </ul>
      </div>
    </header>
    <section id="home">
      <div class="landing__page">
        <div class="landing__wrapper">
          <div class="landing">
            <h1 class="landing__title">Welcome to MovieSearch. The best place to find the right movie.</h1>
            <h2 class="landing__sub-title">Let's find that Perfect Movie</h2>
            <div class="search__bar">
              <div class="input__wrapper">
                <input class="search__input" id="myText" type="text" placeholder="search by genre or title">
                <button class="search__btn click" onclick="processText()"><i class="fa-solid fa-magnifying-glass"></i></button>
              </div>
            </div>
            <select id="filter" onchange="filterMovies(event)">
              <option value="" disabled selected>Sort</option>
              <option value="A-Z">Title, A - Z</option>
              <option value="Z-A">Title, Z - A</option>
              <option value="Newest">Age, Newer to Older</option>
            </select>
          </div>
        </div>
      </div>
    </section>
    <section id="movies__section" >
      <div class="movies">
        
      </div>
      </div>
    </section>
  </div>
  <footer>
    <img class="footer__logo" src="assets/logo.png" alt="">
    <p class="copyright">Copyright © Andy Jackson 2026</p>
  </footer>
</body>
</html>
