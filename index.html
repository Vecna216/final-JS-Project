<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="index.css">
  <script delay src="index.js"></script>
  <script src="https://kit.fontawesome.com/279f2c02eb.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">
    <header class="navbar">
      <div class="header__wrapper">
        <div class="logo__wrapper">
          <img src="assets/logo.png" class="logo" alt="">
        </div>
        <ul class="nav__links">
          <li>
            <a href="" class="nav__link link__hover-effect">Home</a>
          </li>
          <li>
            <a href="" class="nav__btn">Find a Movie</a>
          </li>
        </ul>
      </div>
    </header>
    <section>
      <div class="landing__page">
        <div class="landing__wrapper">
          <div class="landing">
            <h1 class="landing__title">Welcome to MovieSearch. The best place to find the right movie.</h1>
            <h2 class="landing__sub-title">Lets find that Perfect Movie</h2>
            <div class="search__bar">
              <div class="input__wrapper">
                <input class="search__input" type="text" placeholder="search by genre or title">
                <button class="search__btn click"><i class="fa-solid fa-magnifying-glass"></i></button>
              </div>
            </div>
          </div>
          <div class="img__wrapper">
            <img class="landing__img" src="assets/undraw_horror-movie_9020 (1).png" alt="">
          </div>
        </div>
      </div>
    </section>
  </div>
  <footer>
    <img class="footer__logo" src="assets/logo.png" alt="">
    <p class="copyright">Copyright © Andy Jackson 2026</p>
  </footer>
</body>
</html>
